name: Daily product sync

on:
  schedule:
    # Once per day. GitHub runs cron schedules in UTC and may start a few minutes late.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    # Use GitHub's hosted macOS network because the shop rejects Linux runners.
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch complete live catalogue
        run: npm run fetch:products

      - name: Check changed files
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/lib/products.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The catalogue is already current."
            exit 0
          fi

          unexpected_files="$(git diff --name-only | grep -Fvx 'src/lib/products.ts' || true)"
          if [[ -n "$unexpected_files" ]]; then
            echo "The catalogue fetch changed unexpected files:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate catalogue and site
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run check
          npm run build
          npm run check:prices

      - name: Upload validated site
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Commit and publish catalogue
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/lib/products.ts
          git commit -m "chore: sync product catalogue [github-actions]"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    if: needs.sync.outputs.changed == 'true'
    needs: sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
