name: Fetch Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Dr Biomaster API
        run: |
          node <<'NODE'
          const API = 'https://drbiomaster.com/wp-json/wc/store/v1/products?per_page=1&page=1';
          const headers = {
            accept: 'application/json, text/plain, */*',
            'accept-language': 'bg-BG,bg;q=0.9,en-US;q=0.8,en;q=0.7',
            referer: 'https://drbiomaster.com/',
            'user-agent':
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'
          };

          async function probe(url, label) {
            const response = await fetch(url, { headers });
            console.log(`${label}: ${response.status}`);
            const text = await response.text();
            console.log(text.slice(0, 180).replace(/\s+/g, ' '));
            if (!response.ok) process.exitCode = 1;
          }

          await probe(API, 'direct');
          await probe(`${API}&_jsonp=probeCallback`, 'jsonp');
          NODE
